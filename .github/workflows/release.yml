# GitHub Actions Workflow - Release Management
# Automated releases and version tagging

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run all tests
      run: |
        pip install pytest pytest-cov
        pytest tests/ -v

    - name: Generate release notes
      id: release_notes
      run: |
        echo "## Release Notes" > release_notes.md
        echo "" >> release_notes.md
        echo "### Features" >> release_notes.md
        echo "- Cricket analytics for T20 World Cup (2014-2024)" >> release_notes.md
        echo "- Automated Cricsheet data downloader" >> release_notes.md
        echo "- Comprehensive batting and bowling analysis" >> release_notes.md
        echo "- Match insights and visualizations" >> release_notes.md
        echo "" >> release_notes.md
        echo "### Datasets Included" >> release_notes.md
        echo "- 181 T20 World Cup matches" >> release_notes.md
        echo "- 40,966 ball-by-ball records" >> release_notes.md
        echo "- 525 batsmen analyzed" >> release_notes.md
        echo "- 372 bowlers analyzed" >> release_notes.md

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        body_path: release_notes.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-artifacts:
    name: Publish Release Artifacts
    runs-on: ubuntu-latest
    needs: create-release

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create distribution package
      run: |
        mkdir -p dist
        tar -czf dist/cricket-analytics-source.tar.gz \
          scripts/ \
          notebooks/ \
          docs/ \
          tests/ \
          requirements.txt \
          README.md \
          --exclude='*.pyc' \
          --exclude='__pycache__'

    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: cricket-analytics-package
        path: dist/
